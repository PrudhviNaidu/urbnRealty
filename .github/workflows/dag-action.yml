name: DAG actions like dependencies

on:
  [push]

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, world!"

  job2:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Second Hello, world!"
      
  job3:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - run: echo "Third Hello, world!"

  job4:
    runs-on: ubuntu-latest
    needs: 
      - job2
      - job3
    steps:
      - run: echo "Fourth Hello, world!"